<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple TSP Visualizer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f4f4;
  }
  #canvas {
    background: white;
    border: 2px solid black;
    margin-top: 20px;
  }
  button {
    margin: 8px;
    padding: 10px 18px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
    border-radius: 5px;
  }
  button:hover {
    background: #444;
  }
</style>
</head>
<body>
<h2>Travelling Salesman Problem (Simplified)</h2>
<p>Add exactly 4 cities by clicking on the canvas.</p>

<button onclick="runGreedy()">Run Greedy</button>
<button onclick="runBruteForce()">Run BruteForce</button>
<button onclick="runDP()">Run DP</button>
<button onclick="resetCanvas()" style="background:red">Reset</button>

<br />
<canvas id="canvas" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const MAX_CITIES = 4;
let cities = [];

canvas.addEventListener("click", (e) => {
  if (cities.length >= MAX_CITIES) return alert("Only 4 cities allowed");
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  cities.push({ x, y });
  drawCities();
});

function drawCities(path = null) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  if (path) {
    ctx.moveTo(cities[path[0]].x, cities[path[0]].y);
    path.forEach((i) => ctx.lineTo(cities[i].x, cities[i].y));
    ctx.closePath();
    ctx.strokeStyle = "blue";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  cities.forEach((c, i) => {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillText(i, c.x + 8, c.y - 8);
  });
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function totalDistance(order) {
  let d = 0;
  for (let i = 0; i < order.length - 1; i++) d += dist(cities[order[i]], cities[order[i + 1]]);
  d += dist(cities[order.at(-1)], cities[order[0]]);
  return d;
}

function runGreedy() {
  if (cities.length !== MAX_CITIES) return alert("Add 4 cities first");
  let visited = new Set([0]);
  let path = [0];
  for (let i = 1; i < MAX_CITIES; i++) {
    let last = path[path.length - 1];
    let next = [...cities.keys()].filter((x) => !visited.has(x)).sort((a, b) => dist(cities[last], cities[a]) - dist(cities[last], cities[b]))[0];
    visited.add(next);
    path.push(next);
  }
  drawCities(path);
}

function runBruteForce() {
  if (cities.length !== MAX_CITIES) return alert("Add 4 cities first");
  let perm = [1, 2, 3];
  let best = [0, 1, 2, 3];
  let bestDist = Infinity;
  function* p(arr, i = 0) {
    if (i >= arr.length) return yield arr.slice();
    for (let j = i; j < arr.length; j++) [arr[i], arr[j]] = [arr[j], arr[i]], yield* p(arr, i + 1), [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  for (const permu of p(perm)) {
    const path = [0, ...permu];
    const d = totalDistance(path);
    if (d < bestDist) (bestDist = d), (best = path);
  }
  drawCities(best);
}

function runDP() {
  if (cities.length !== MAX_CITIES) return alert("Add 4 cities first");
  const n = MAX_CITIES;
  const dp = Array(1 << n).fill().map(() => Array(n).fill(Infinity));
  dp[1][0] = 0;
  for (let mask = 1; mask < 1 << n; mask++) {
    for (let last = 0; last < n; last++) {
      if (!(mask & (1 << last))) continue;
      for (let next = 0; next < n; next++) {
        if (mask & (1 << next)) continue;
        dp[mask | (1 << next)][next] = Math.min(dp[mask | (1 << next)][next], dp[mask][last] + dist(cities[last], cities[next]));
      }
    }
  }
  let best = Infinity, endCity = 0;
  for (let i = 1; i < n; i++) {
    const d = dp[(1 << n) - 1][i] + dist(cities[i], cities[0]);
    if (d < best) best = d, endCity = i;
  }
  drawCities([0, ...Array.from({ length: n - 1 }, (_, i) => i + 1)]);
}

function resetCanvas() {
  cities = [];
  drawCities();
}
</script>
</body>
</html>
